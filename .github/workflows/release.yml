# Publishes to npm (with provenance) when a vX.Y.Z tag is pushed. Needs the NPM_TOKEN secret
# (an automation token for the @pletopay scope).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # No dependency cache in the publish job: a poisoned cache entry could end up in the
          # published package (zizmor cache-poisoning). CI keeps caching; this job is rare.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: pnpm verify
      - run: pnpm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
