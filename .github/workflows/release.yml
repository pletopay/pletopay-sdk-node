# Publishes to npm (with provenance) when a vX.Y.Z tag is pushed. Uses npm trusted publishing:
# npm swaps this job's OIDC token for a short-lived publish token, so no npm secret is stored.
# The trusted publisher on npmjs.com is bound to this file and the `npm` environment.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # No dependency cache in the publish job: a poisoned cache entry could end up in the
          # published package (zizmor cache-poisoning). CI keeps caching; this job is rare.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: pnpm verify
      - run: npm publish --provenance --access public
